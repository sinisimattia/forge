name: CI

# Four push/PR jobs and one scheduled one:
#   - unit:              fast, runs on every push and PR. Sanitize gates everything else,
#                         because it is the cheapest check and the one that catches an
#                         extraction mistake (a source-project trace or a populated secret).
#   - generated-project: push AND PR. Actually generates a project and runs its lint/
#                         typecheck/test/build/purity/layers/coverage gates — slow (an npm ci
#                         plus a Nuxt build), and it does that twice: once for the gate suite
#                         and once for the inventory suite. It installs with `npm ci` so the
#                         committed lockfile is exercised by the same command Docker and
#                         dev:up use.
#   - storybook:          push AND PR, and blocking. `build-storybook` is a separate nx
#                         target that `nx run-many -t build` never invokes; this job is the
#                         only thing that compiles the story files at all. It was
#                         non-blocking and known-red until 2026-09-21 — see its own comment
#                         below for what was actually wrong, and for why a green tick here
#                         means nothing without the glob assertion that backs it.
#   - docker:             push AND PR, and the slowest. Boots the generated stack for real
#                         and checks `/health`.
#
# ## Why the slow tiers run on push (fixed in Phase 3, Task 20)
#
# They used to be `if: github.event_name == 'pull_request'`, every one of them. The
# consequence was that a direct push to `main` — which this repository permits — ran the
# `unit` tier and nothing else, so the gate that actually generates a project and runs its
# suites did not run on the branch it exists to protect. Everything a PR checked could be
# landed by pushing. `generated-project` is where the template's own discriminating tests
# live (D2/D5/D9/D12/D14/D15 and the rest of spec §11's table), which made that gap the
# difference between having those tests and having a file that contains them.
#
# The cost is real and was accepted deliberately: a push to `main` now spends ~30 minutes in
# `generated-project` and up to ~45 in `docker` rather than ~10. A gate that runs only on
# the path somebody can choose not to take is not a gate.
#   - lockfile-refresh:   scheduled only (weekly), never on push/PR. See its own comment below.
#
# Forge ships zero runtime and zero test dependencies (ADR-0002), so there is no lockfile and
# no `npm install`/`npm ci` step for forge's own package.json — there is nothing to install.
# `npm ci` was checked directly against this repo and fails outright with no package-lock.json
# (EUSAGE), so it is deliberately never invoked here. The generated projects created inside the
# integration/storybook/docker steps below are a different package.json tree entirely, ship
# their own package-lock.json, and do get an explicit install — `npm ci` in every case: inside
# the test files themselves for the integration/docker tiers, and as its own step for storybook.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, Monday 06:00 UTC. `template/package-lock.json` pins the generated-project
    # dependency graph as of the day it was last refreshed — that is the whole point of
    # shipping it, but it also means it goes stale the moment anything it pins gets a new
    # release. A stale-but-still-installable lockfile fails silently: `npm ci` keeps
    # succeeding against old versions forever, so nothing in the PR-tier jobs above would
    # ever notice drift building back up. This job re-resolves the lockfile from scratch on
    # a schedule so that drift is caught here, by forge, before it reaches a user who
    # generates a project on a bad day — see the `lockfile-refresh` job below.
    - cron: '0 6 * * 1'

# Least privilege by default — none of these jobs need to write anything.
permissions:
  contents: read

jobs:
  unit:
    name: unit (sanitize + generator tests)
    # Push/PR only — the schedule trigger exists solely to drive `lockfile-refresh` below,
    # not to re-run the ordinary push/PR tiers against an unchanged commit.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sanitize (extraction gate — must pass before anything else)
        run: npm run sanitize
      - name: Unit tests
        run: npm test

  generated-project:
    name: generated-project gate (lint/typecheck/test/build/purity/layers/coverage)
    needs: unit
    # Push AND PR — see "Why the slow tiers run on push" at the top of this file. The
    # `schedule` trigger drives `lockfile-refresh` alone, which runs this same command
    # against a regenerated lockfile, so this job excludes itself from it rather than
    # running the identical gate twice on an unchanged commit.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:integration

  # Push AND PR, and blocking. `build-storybook` is a separate nx target that `nx run-many
  # -t build` never invokes, so a broken story would otherwise pass every check — this job is
  # the only thing that compiles the story files at all.
  #
  # ## It was non-blocking and known-red until 2026-09-21, and this is what was wrong
  #
  # The failure was always `✓ 0 modules transformed` followed by `[vite:build-html] Missing
  # field 'moduleType'`, and every word of that is a false lead. `vite:build-html` is not at
  # fault; it is merely the plugin that owned the transform chain for `iframe.html`, which is
  # the first module in the graph. The real cause is a Vite major-version split inside one
  # build: Nuxt 4.5's `@nuxt/vite-builder` contributes a `nuxt:replace` plugin that is a
  # *Rolldown-native* plugin (Nuxt 4.5 builds on Vite 8 / Rolldown), while Storybook builds
  # with `@storybook/builder-vite@9`, which is Vite 7 / Rollup. Rollup calls that native
  # plugin's `transform` with Rollup's argument shape and the NAPI binding rejects it over a
  # field Rollup has no concept of. It throws on the entry HTML, so nothing is ever
  # transformed. Two further faults were hidden behind it, both of which only became visible
  # once the build got far enough to reach them: `.storybook/preview.ts` imported a
  # stylesheet that has never existed in this template, and the stories' `libs/core` imports
  # could not be bundled from core's CommonJS `dist/`. All three fixes are in
  # `template/apps/webapp/.storybook/`, each with the reasoning next to it.
  #
  # Earlier attempts attributed this to dependency drift and then to a missing lockfile.
  # Neither was it; see `docs/superpowers/phase-1-decision-log.md` for that history, which is
  # left standing as a record of what was believed rather than corrected.
  #
  # ## The one fact worth carrying forward: the exit code here proves nothing on its own
  #
  # `storybook build` exits 0 over an empty module graph. For the entire time this job was
  # red it was also, separately, verifying nothing — and had the `moduleType` error not
  # happened to be fatal, the same job would have gone *green* having compiled zero stories,
  # and nobody would have looked. A failed run even leaves a `storybook-static/` directory
  # behind, so that directory's existence is not evidence either.
  #
  # So this job's value rests entirely on the `stories` glob in `.storybook/main.ts`
  # continuing to match real files. `app/test/storybook-config.spec.ts` asserts exactly that,
  # in the fast tier, for milliseconds — it does not replace this job (it reads text and the
  # filesystem; this one builds), it guards the assumption this job cannot check about
  # itself. If you change the glob, the stories' location, or the framework, read that spec
  # before trusting a green tick here.
  #
  # Verified when this was fixed: a passing run transforms 604 modules, and deliberately
  # breaking one story's import turns the run red naming that story file.
  storybook:
    name: template Storybook build (compiles every story file)
    needs: unit
    # Push AND PR, like `generated-project` and `docker` and for the same reason: a gate that
    # runs only on the path somebody can choose not to take is not a gate. It was PR-only
    # while it was known-red — running a permanently-yellow job on every push is how a team
    # learns to read a non-green CI page as normal — and that reason expired with the fix.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate a throwaway project
        run: npm run create -- --name storybookapp --out "$RUNNER_TEMP" --yes --no-git
      - name: Install the generated project's dependencies from its committed lockfile
        working-directory: ${{ runner.temp }}/storybookapp
        run: npm ci
      - name: Build Storybook (a separate nx target that `nx run-many -t build` never invokes)
        working-directory: ${{ runner.temp }}/storybookapp
        run: npx nx run webapp:build-storybook

  docker:
    name: docker e2e (boots the generated stack, asserts /health)
    needs: unit
    # Push AND PR, for the same reason `generated-project` is — and with more force, not
    # less: every defect this tier has ever caught was one that only appears once the
    # images actually run, which is to say one that no faster tier can see.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:integration
        env:
          FORGE_E2E: '1'

  # Scheduled only (see the `schedule:` trigger's comment at the top of this file). This is
  # the condition that makes shipping a lockfile sound rather than a slow-motion staleness
  # problem: `template/package-lock.json` records dependency resolution as of the day it was
  # generated, and nothing about a normal push/PR ever re-resolves it from scratch, so drift
  # could rebuild silently for months and only surface the day someone happens to delete
  # node_modules and reinstall, or the day the pinned versions stop being mirrored. This job
  # regenerates the lockfile for real (`npm run refresh-lockfile`, which works around
  # `template/`'s own package.json files not being installable directly — see that script's
  # comment) and runs the same gate a PR would (`npm run test:integration`) against the
  # result. It deliberately does NOT commit the regenerated lockfile — a red run here is the
  # signal a human needs to look, not something to silently paper over with an auto-commit
  # that could just as easily land a broken lockfile on `main` unattended. On failure, a
  # human runs `npm run refresh-lockfile` locally, reviews the diff, fixes whatever broke,
  # and commits it themselves.
  lockfile-refresh:
    name: weekly lockfile drift check (schedule-only; never commits)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate template/package-lock.json from scratch
        run: npm run refresh-lockfile
      - name: Run the generated-project gate against the regenerated lockfile
        run: npm run test:integration
