# __FORGE_TITLE__ dev environment — whole stack, one command:  npm run dev:up
# (backend + webapp + postgres, all on Node 22 inside containers)
#
# Host-published ports are configurable via a root `.env` file (see `.env.example`);
# the values here are the fallbacks. Only the host side changes — container-internal
# ports stay fixed.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: __FORGE_NAME__
      POSTGRES_PASSWORD: __FORGE_NAME__
      POSTGRES_DB: __FORGE_DB_NAME__
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U __FORGE_NAME__ -d __FORGE_DB_NAME__']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${BACKEND_PORT:-3000}:3000'
      - '${BACKEND_DEBUG_PORT:-9229}:9229'
    # NOTE: `environment:` takes precedence over `env_file:`, so these pinned values win
    # over anything in apps/backend/.env.
    # Two roles, two URLs. `postgres` above creates `__FORGE_NAME__`, which owns the
    # schema; the first migration creates `__FORGE_NAME__-app`, which owns nothing and is
    # what the API actually connects as. That separation is the whole of the append-only
    # audit guarantee: a privilege revoked from a non-owner is one the application cannot
    # grant back to itself. See apps/backend/src/db/migrations/ for the argument in full.
    #
    # There is no `migrate` service here, unlike compose.prod.yaml. The dev image's own
    # CMD is `npm run migration:run -w apps/backend && npm run start:dev -w apps/backend`
    # (apps/backend/Dockerfile, `dev` target), so migrations already run to completion, in
    # this container, before Nest bootstraps — including the one that creates the role the
    # line below connects as. A separate one-shot would build a second image and do the
    # same work twice.
    #
    # These credentials are obviously-local and inline on purpose, exactly as the
    # postgres service's own are: a dev stack that needs a populated .env before it will
    # start is a dev stack nobody runs.
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://__FORGE_NAME__-app:__FORGE_NAME__-app@postgres:5432/__FORGE_DB_NAME__
      MIGRATION_DATABASE_URL: postgresql://__FORGE_NAME__:__FORGE_NAME__@postgres:5432/__FORGE_DB_NAME__
      APP_DB_ROLE: __FORGE_NAME__-app
      APP_DB_PASSWORD: __FORGE_NAME__-app
      PORT: '3000'
      CORS_ORIGIN: http://localhost:${WEBAPP_PORT:-3001}
      # Same origin as CORS_ORIGIN, same reason: what a browser on the host actually
      # reaches. FileMailer's links are read from disk in dev, but they still have to
      # resolve to the running webapp if anyone opens one. See .env.example and
      # apps/backend/src/mail/templates/reset-password.ts for why this is never taken
      # from an incoming request instead.
      PUBLIC_WEBAPP_URL: http://localhost:${WEBAPP_PORT:-3001}
      # The origin `OAuthService` builds every provider redirect URI from. This
      # container refuses to boot without it, whether or not any federated
      # provider is actually configured — `OAuthService` is an ordinary
      # provider of `AuthModule`, so `ConfigService.getOrThrow` runs at
      # construction, not on first use. Same reasoning as `PUBLIC_WEBAPP_URL`
      # above and `oauth.config.ts`'s own doc: never taken from an incoming
      # request, because that would let anyone who can reach this API choose
      # where an authorization code is delivered.
      PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-3000}
      # The name an authenticator app shows for this deployment's second factor.
      # This container refuses to boot without one — `MfaService` reads it with
      # `getOrThrow` at construction. A display name and not a credential, so it
      # is inline like the values around it.
      MFA_ISSUER: __FORGE_TITLE__
      # WebAuthn is optional and absent unless MFA_WEBAUTHN_ENABLED is `true`. These
      # pass through from the shell or the project's .env with an empty default, and
      # empty means unset: the API boots without WebAuthn exactly as it does with none
      # of them. Enabled without an RP ID or an origin it refuses to boot
      # (`buildWebAuthnConfig`). These variables therefore reach the container ONLY from the
      # shell or the project root's .env: setting them in apps/backend/.env has no effect,
      # because these lines override that file even when they interpolate to empty, and the
      # result is no WebAuthn and no error. Deliberately no `:?required` — that would make a
      # feature most deployments do not use a precondition for starting.
      MFA_WEBAUTHN_ENABLED: ${MFA_WEBAUTHN_ENABLED:-}
      MFA_WEBAUTHN_RP_ID: ${MFA_WEBAUTHN_RP_ID:-}
      MFA_WEBAUTHN_ORIGIN: ${MFA_WEBAUTHN_ORIGIN:-}
      # The key access credentials are signed with. Obviously-local and inline, exactly
      # as the postgres credentials above are and for the same reason: a dev stack that
      # needs a populated .env before it will start is a dev stack nobody runs. The
      # production stack has no default for this at all (compose.prod.yaml) — a shared
      # fallback signing key is one anybody holding this template can mint a credential
      # for any account with.
      JWT_SECRET: __FORGE_NAME__-local-dev-signing-key-not-for-production
    env_file:
      - path: apps/backend/.env
        required: false
    # `nest start --watch` keeps the tsc watcher alive even when Nest fails to bootstrap,
    # so without this the container reports "Up" while the API is dead. Long start_period:
    # the first in-container compile takes a while.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/backend/node_modules
      - /app/apps/webapp/node_modules
      - /app/.nx

  webapp:
    build:
      context: .
      dockerfile: apps/webapp/Dockerfile
      target: dev
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '${WEBAPP_PORT:-3001}:3001'
    environment:
      NODE_ENV: development
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost:3000}
      # SSR runs inside this container, where `localhost` is not the backend.
      # Reach it over the compose network instead (container-internal port is fixed at 3000).
      NUXT_API_BASE_SERVER: http://backend:3000
      NUXT_PUBLIC_APP_NAME: __FORGE_TITLE__
    env_file:
      - path: apps/webapp/.env
        required: false
    # The dev CMD (apps/webapp/Dockerfile) builds core before starting `nuxt dev`, and
    # that build plus Vite's warm-up both take real time — this container is "running"
    # well before it is answering requests. Without a healthcheck, `docker compose up
    # --wait` (and `depends_on: condition: service_healthy` on anything added after this
    # service) would treat "process started" as "ready," the same gap that let this
    # service ship for days with nothing ever checking it actually served a page. Same
    # shape as the `backend` healthcheck above; long `start_period` for the same reason —
    # the first in-container `nx build core` takes a while.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 90s
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/backend/node_modules
      - /app/apps/webapp/node_modules
      - /app/.nx

volumes:
  pgdata:
