# __FORGE_TITLE__ production images — build + run the prod targets:  npm run prod:up
#
# This runs the REAL production build (compiled backend, Nitro webapp output) on your
# machine, so a fresh clone can smoke-test what gets deployed. It is a local harness,
# not a deployment: every credential below must be supplied by the environment (no
# defaults) so this file can never silently fall back to a dev credential.
#
# Schema migrations run automatically via the one-shot `migrate` service.

# Backend image, shared by the `migrate` one-shot and the long-running `backend` service.
# Both reference one image tag so it is built once.
x-backend-image: &backend-image
  build:
    context: .
    dockerfile: apps/backend/Dockerfile
    target: prod
  image: __FORGE_NAME__-backend:local

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:?required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:?required} -d ${POSTGRES_DB:?required}']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies TypeORM migrations, then exits. `backend` waits for it to succeed.
  #
  # This is the only service that connects as the schema owner, and the only one that is
  # told the application role's password — it is the service that creates that role. The
  # split is the mechanism behind the append-only audit log: the application connects as a
  # role that owns nothing, so a privilege revoked from it is one it cannot grant back.
  migrate:
    <<: *backend-image
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      MIGRATION_DATABASE_URL: postgresql://${POSTGRES_USER:?required}:${POSTGRES_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:?required}
      APP_DB_ROLE: ${APP_DB_ROLE:?required}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?required}
    command: ['npm', 'run', 'migration:run:prod']

  backend:
    <<: *backend-image
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Host-published port only, exactly as compose.yaml does it: the
    # container-internal port stays fixed at 3000. A hardcoded host port makes
    # this file unusable on any machine that already has something on 3000 —
    # including the e2e gate, which allocates a free port rather than assuming.
    ports:
      - '${BACKEND_PORT:-3000}:3000'
    # NOTE: `environment:` takes precedence over `env_file:`, so these pinned values win
    # over anything in apps/backend/.env.
    #
    # `MIGRATION_DATABASE_URL` is deliberately absent, and its absence is load-bearing.
    # `db/data-source.ts` falls back to `DATABASE_URL` when it is unset, so handing this
    # service the owner's URL under either name would run the application as the schema
    # owner — and an owner can grant itself back every privilege the audit migration took
    # away. Nothing would fail; the guarantee would just quietly not hold. The application
    # is given the restricted role's URL and nothing else — the owner's credentials reach
    # no service but `migrate`. (`APP_DB_PASSWORD` is read here too, of course: it is the
    # password in the URL below. It is `APP_DB_ROLE`/`APP_DB_PASSWORD` as a *pair of
    # migration inputs* that this service has no use for.)
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${APP_DB_ROLE:?required}:${APP_DB_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:?required}
      PORT: '3000'
      CORS_ORIGIN: http://localhost:3001
      # Required, with no default, and the absence of a default is the point: this is
      # the origin every verification and recovery link is built from, and a wrong value
      # here is a working link pointing at somebody else's domain. See
      # apps/backend/src/mail/templates/reset-password.ts for why it can never be taken
      # from the incoming request instead, which is the "fix" a missing value invites.
      PUBLIC_WEBAPP_URL: ${PUBLIC_WEBAPP_URL:?required}
      # Where the dev mailer writes one JSON file per message. It has a default because a
      # wrong value costs a message nobody could have read anyway; the origin above does
      # not, because a wrong value there is a credential delivered to the wrong place.
      # ADR-0008: this template binds no mail provider, so a production stack brought up
      # from this file delivers nothing until somebody writes a real adapter.
      MAIL_OUTBOX_DIR: ${MAIL_OUTBOX_DIR:-/app/.mail-outbox}
      # Required, with no default. A fallback signing key would be shared by every
      # project generated from this template, and whoever holds it can mint an access
      # credential for any account on any of them.
      JWT_SECRET: ${JWT_SECRET:?required}
    env_file:
      - path: apps/backend/.env
        required: false
    # The slim runtime images ship no curl; Node 22 has a global fetch.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  webapp:
    build:
      context: .
      dockerfile: apps/webapp/Dockerfile
      target: prod
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '${WEBAPP_PORT:-3001}:3000'
    environment:
      NODE_ENV: production
      NUXT_PUBLIC_API_BASE: http://localhost:3000
      # SSR runs inside this container, where `localhost` is not the backend.
      # Reach it over the compose network instead (container-internal port is fixed at 3000).
      NUXT_API_BASE_SERVER: http://backend:3000
      NUXT_PUBLIC_APP_NAME: __FORGE_TITLE__
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  pgdata:
