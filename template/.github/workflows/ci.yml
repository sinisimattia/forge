name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; `verify` widens it below.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # nx-set-shas queries the workflow-runs API to find the last successful run,
    # which needs `actions: read`. The repo default is contents-only, so without
    # this the action fails with "Resource not accessible by integration".
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - uses: nrwl/nx-set-shas@v5
      # `build-storybook` is named explicitly and that is not redundant: it is a separate nx
      # target, and `-t build` does not invoke it. Leaving it off this line is how a story
      # file ends up compiled by nothing at all — Forge's own CI had exactly that gap for two
      # phases, and the stories it shipped in that window were never once bundled.
      #
      # It is on the same `affected` line as the rest rather than in a job of its own so that
      # it runs on every push and pull request this workflow handles, with no
      # `continue-on-error` and no condition of its own. A gate that runs only on the path
      # somebody can choose not to take is not a gate.
      #
      # One thing to know before trusting a green run: `storybook build` exits 0 over an empty
      # module graph, so its exit code alone is not evidence that any story was compiled. The
      # count it prints is. `apps/webapp/app/test/storybook-config.spec.ts` asserts in the fast
      # tier that the `stories` glob still matches real files, which is the assumption this
      # step cannot check about itself.
      - name: Lint, typecheck, test, build, storybook, purity, layers, coverage (affected)
        run: npx nx affected -t lint typecheck test build build-storybook purity layers coverage --base=$NX_BASE --head=$NX_HEAD

  docker:
    runs-on: ubuntu-latest
    env:
      # CI-only placeholders for the disposable smoke-test stack. Never used by a real deploy.
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci-only-placeholder  # sanitize:allow — throwaway CI container, never a real credential
      POSTGRES_DB: ci
    steps:
      - uses: actions/checkout@v7
      - name: Build production images
        run: docker compose -f compose.prod.yaml build
      # Building is not enough: a prod-only misconfiguration (missing runtime assets,
      # unset secrets, unmigrated schema) only shows up when the images actually run.
      - name: Start the production stack
        run: docker compose -f compose.prod.yaml up -d --wait
      - name: Smoke-test the running stack
        run: |
          curl -fsS http://localhost:3000/health
          curl -fsS -o /dev/null http://localhost:3001/
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f compose.prod.yaml logs --no-color
      - name: Tear down
        if: always()
        run: docker compose -f compose.prod.yaml down -v
